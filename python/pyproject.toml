[project]
name = "apiverve-menstrualcyclecalculator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Menstrual Cycle Calculator is a period tracker API that predicts future menstrual cycles, fertile windows, and ovulation dates from the last period date and the average cycle and period length."
keywords = ["menstrual cycle api", "period tracker api", "menstrual cycle calculator api", "menstrual period predictor", "next period date calculator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/menstrualcycle?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/menstrualcycle?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/menstrualcycle-api"
Twitter = "https://twitter.com/apivervehq"
